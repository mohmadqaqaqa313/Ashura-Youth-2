<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>هيئه شباب عاشوراء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="page home-page" data-theme="dark">
        <header>
            <div class="logo">
                <span class="logo-icon">⚔️</span>
                <h1>هيئه شباب عاشوراء</h1>
            </div>
            <div class="header-actions">
                <p class="subtitle">نهضة شبابية على درب الحسين (ع)</p>
                <button id="themeToggle" class="theme-toggle" aria-label="تبديل الوضع">
                    <span class="toggle-icon">🌙</span>
                </button>
            </div>
        </header>

        <main class="hero">
            <div class="hero-content">
                <div class="badge">🌿 نستلهم من عاشوراء</div>
                <h2>نحو بناء مجتمعٍ واعٍ</h2>
                <p>
                    شباب اليوم هم قادة الغد، نستلهم من ثورة عاشوراء قيم العدل
                    والكرامة والتضحية.
                </p>
                <div class="btn-group">
                    <a href="hadith.html" class="primary-btn">
                        <span>📖</span> أقوال الإمام الحسين
                    </a>
                    <a href="releases.html" class="secondary-btn" style="border-color: var(--control-color); color: var(--control-color);">
                        📚 الإصدارات
                    </a>
                </div>
            </div>
            <div class="hero-image">
                <div class="floating-shapes">
                    <span class="shape shape1">🌹</span>
                    <span class="shape shape2">🏹</span>
                    <span class="shape shape3">☀️</span>
                </div>
                <div class="main-icon">⚔️</div>
            </div>
        </main>

        <section class="contact-section">
            <div class="contact-content">
                <h3>📱 تواصل معنا</h3>
                <a href="https://t.me/S_V_Cc" target="_blank" class="telegram-btn">
                    💬 @S_V_Cc
                </a>
            </div>
        </section>

        <footer>
            <p>© 2026 شباب عاشوراء – جميع الحقوق محفوظة</p>
        </footer>
    </div>

    <script>
        (function() {
            const page = document.querySelector('.page');
            const toggleBtn = document.getElementById('themeToggle');
            const toggleIcon = toggleBtn.querySelector('.toggle-icon');
            const savedTheme = localStorage.getItem('theme');
            let currentTheme = savedTheme || 'dark';

            function setTheme(theme) {
                currentTheme = theme;
                page.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                toggleIcon.textContent = theme === 'dark' ? '🌙' : '☀️';
            }

            toggleBtn.addEventListener('click', () => {
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                setTheme(newTheme);
            });

            setTheme(currentTheme);
        })();
    </script>
</body>
</html>
