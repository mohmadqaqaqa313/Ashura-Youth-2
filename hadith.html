    <script>
        const hadiths = [
            "قال الإمام الحسين(ع): مجالسة أهل الدناءة شر ، ومجالسة أهل الفسق ريبة.",
            "قال الإمام الحسين(ع): لو رأيتم المعروف رجلا رأيتموه حسنا جميلا تسر الناظرين ولو رأيتم اللؤم رأيتموه سمجا مشوها تنفر منه القلوب وتغض دونه الابصار.",
            "قال الإمام الحسين(ع): لا تتكلمن فيما لا يعنيك.",
            "قيل للحسين عليه السلام إنّ أباذر يقول: الفقر أحبّ إليّ من الغنى، فقال الحسين عليه السلام: «رحم الله تعالى أباذر، أمّا أنا فأقول: مَن اتكَلَ على حُسنِ اختيار الله تعالى له، لم يتمنّ غير ما اختاره الله عزّ وجل له.",
            "قال الحسين عليه السلام: «لِلسّلام سبعونَ حسنَة، تسعٌ وسِتّون للمبتدي، وواحدةٌ لِلرّاد.",
            "قال الحسين عليه السلام: «البخيل مَن بَخِل بالسّلام.",
            "قال رجل للحسين عليه السلام ابتداءً: كيف أنت عافاك الله؟ فقال الحسين عليه السلام له: «السّلام قبل الكلام عافاك الله». ثمّ قال عليه السلام: «لا تأذنوا لأحدٍ حتّى يُسلّم».",
            "قال الحسين عليه السلام: «الصِّدقُ عِزٌّ، والكِذبُ عجزٌ، والسِرُّ أمانةٌ، والجِوارُ قَرابةٌ، والمعونةُ صَداقةٌ، والعَملُ تَجربَةٌ، والخُلْقُ الحَسَنُ عِبادةٌ، والصَّمتُ زَيْنٌ، والشُّحُّ فقرٌ، والسَّخاءُ غِنًى، والرِّفقُ لُبٌّ.",
            "روى عبد الله بن عباس، قال لي الحسين عليه السلام: «يا ابنَ عباس، لا تتكلّمنّ بما لا يُعْنيكَ فإنني أخاف عليكَ الوِزرَ، ولا تتكلّمنّ بما يُعنيك حتى تَرى له موضعاً، فَرُبَّ متكلّم قد تكلّمَ بحقٍّ فَعيبَ، ولا تماريَنّ حليماً ولا سفيهاً، فإنّ الحليمَ يقليكَ، والسّفيه يُرديك، ولا تقولَنّ خَلفَ أحدٍ إذا توارى عنكَ، إلا مثلَ ما تُحبُّ أن يقولَ عنكَ إذا توارَيْتَ عنه، واعمل عَملَ عبدٍ يَعلَمُ أنّه مأخوذٌ بالإجرام مُجزيٌ بالإحسان، والسّلام.",
            "قال الحسين عليه السلام: «مَن سَرَّه أن يُنْسَأ في أجلهِ ويُزداد في رزقه فَلْيَصِل رَحِمَهُ.",
            "قال الحسين عليه السلام لرجل اغتاب عنده رجلاً: «يا هذا كُفَّ عن الغيبةِ فإنّها إدامُ كلابِ النّار.",
            "عن الإمام الحسين عليه السلام: «إذا كان يوم القيامة نادى منادٍ: أيّها الناس، من كان له على الله أجرٌ فَلْيَقم، فلا يقوم إلا أهلُ المعروف.",
            "قال الصدوق: ثمّ صار حتّى نزل كربلا، فقال: أىّ موضع هذا فقيل كربلا يا ابن رسول اللّه، فقال: هذا واللّه يوم كرب وبلاء، وهذا الموضع الذي يهراق فيه دماؤنا ويباح فيه حريمنا.",
            "عن أبى بصير قال: قال أبو عبد اللّه (عليه السلام) قال الحسين بن علي (عليه السلام) أنا قتيل العبرة لا يذكرنى مؤمن الا استعبر",
            "قال الإمام الحسين (ع): إيّاكَ وَظُلمَ مَن لا يَجِدُ عَلَيكَ نَاصِراً إلّا اللهَ.",
            "كامل الزيارات : عن أبي عبد الله عليه السلام في قول الله عز وجل - : ﴿وَإِذَا الْمَوْؤُدَةُ سُئِلَتْ بِأَيِّ ذَنْبٍ قُتِلَتْ﴾ قال : نزلت في الحسين بن علي عليه السلام ..",
            "قال الإمام الحسين (ع) : إياك وما تعتذر منه، فإن المؤمن لا يسيء، ولا يعتذر والمنافق كل يوم يسيء ويعتذر..",
            "قال الإمام الحسين (ع) : إنّ قوماً عبدوا الله رغبة فتلك عبادة التجار، وان قوماً عبدوا الله رهبة فتلك عبادة العبيد، وان قوماً عبدوا الله شكراً فتلك عبادة الاحرار، وهي افضل العبادة.",
            "قال الإمام الحسين (ع) : ان اعمال هذه الأمة ما من صباح إلاّ وتعرض على الله عزوجل..",
            "قال الإمام الحسين (ع) : سأله رجل عن معنى قول الله: ﴿واما بنعمة ربك فحدث﴾ (٤). قال (عليه السلام): امره ان يحدّث بما انعم الله به عليه في دينه..",
            "قال الإمام الحسين (ع) : دراسة العلم لقاح المعرفة، وطول التجارب زيادة في العقل والشرف، التقوى والقنوع راحة الابدان، ومن احبك نهاك، ومن ابغضك اغراك..",
            "ومن زهد الحسين (عليه السلام) أنّه قيل له: ما اعظم خوفك من ربّك؟ فقال: لا يأمن يوم القيامة إلاّ من خاف الله في الدنيا..",
            "في مناقب ابن شهرآشوب قال: أنّ جبرئيل نزل يوماً، فوجد الزهراء نائمة، والحسين قلقا على عادة الأطفال مع أمهاتهم، فقعد جبرئيل يليهيه عن البكاء حتى استيقظت، فأعلمها رسول الله (صلى الله عليه وآله) بذلك.",
            "بلغه كلام نافع بن جبير في معاوية وقوله: «انه كان يسكته الحلم وينطقه العلم» فقال (عليه السلام): بل كان ينطقه البَطَرُ ويسكته الحَصَر..",
            "قال الإمام الحسين (ع) : من دخل المقابر فقال: «اللّهم ربّ هذه الارواح الفانية، والاجساد البالية، والعظام النخرة، التي خرجت من الدنيا وهي بك مؤمنة ادخل عليهم روحاً منك وسلاماً مني» كتب الله له بعدد الخلق من لدن آدم الى ان تقوم الساعة حسنات..",
        ];

        let currentIndex = 0;
        const hadithText = document.getElementById('hadithText');
        const hadithIndex = document.getElementById('hadithIndex');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function updateHadith() {
            hadithText.textContent = hadiths[currentIndex];
            hadithIndex.textContent = `${currentIndex + 1} / ${hadiths.length}`;
        }

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + hadiths.length) % hadiths.length;
            updateHadith();
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % hadiths.length;
            updateHadith();
        });

        updateHadith();

        (function() {
            const app = document.querySelector('.app');
            const toggleBtn = document.getElementById('themeToggle');
            const icon = toggleBtn.querySelector('i');
            const savedTheme = localStorage.getItem('theme') || 'dark';

            function setTheme(theme) {
                app.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            }

            toggleBtn.addEventListener('click', () => {
                const current = app.getAttribute('data-theme');
                setTheme(current === 'dark' ? 'light' : 'dark');
            });

            setTheme(savedTheme);
        })();
    </script>
</body>
